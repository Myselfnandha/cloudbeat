name: Build and Release CloudBeat APK

on:
  push:
    branches: [ "main", "feature/*" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-check:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Fetch and build native libraries
        run: |
          chmod +x scripts/setup_native_libs.sh
          ./scripts/setup_native_libs.sh

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: dart analyze

      - name: Run unit & widget tests
        run: flutter test

  build-and-release:
    name: Build Universal APK & Publish Release
    needs: quality-check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Fetch and build native libraries
        run: |
          chmod +x scripts/setup_native_libs.sh
          ./scripts/setup_native_libs.sh

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Verify Native Library ABIs in APK
        run: |
          echo "Inspecting packaged native libraries in app-release.apk..."
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E "lib/(arm64-v8a|armeabi-v7a|x86_64)/libcloudbeat_core\.so"
          
          # Assert arm64-v8a is present (mandatory for physical Android devices)
          if ! unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -q "lib/arm64-v8a/libcloudbeat_core.so"; then
            echo "ERROR: lib/arm64-v8a/libcloudbeat_core.so is missing from APK packaging!"
            exit 1
          fi
          echo "Native ABI verification passed: libcloudbeat_core.so bundled for target ABIs."

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudbeat-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Generate Release Metadata
        id: meta
        run: |
          REF_NAME="${{ github.ref_name }}"
          SAFE_REF=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="$REF_NAME"
            TITLE="CloudBeat $REF_NAME"
            PRERELEASE="false"
          elif [[ "$REF_NAME" == "main" ]]; then
            TAG="nightly-main"
            TITLE="CloudBeat Nightly ($SHORT_SHA)"
            PRERELEASE="false"
          else
            TAG="preview-$SAFE_REF"
            TITLE="CloudBeat Preview [$REF_NAME] ($SHORT_SHA)"
            PRERELEASE="false"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.title }}
          make_latest: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          body: |
            ### CloudBeat Universal APK Release
            - **Branch**: `${{ github.ref_name }}`
            - **Commit**: [${{ steps.meta.outputs.short_sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **Triggered By**: @${{ github.actor }}
            - **Event**: `${{ github.event_name }}`
            
            ### Installation
            Download and install **`app-release.apk`**. This single universal APK works across all Android smartphones, tablets, and emulators.
          files: build/app/outputs/flutter-apk/app-release.apk
