name: CloudBeat CI/CD - Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android Split APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go_core/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Locate Android NDK
        id: setup-ndk
        run: |
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            LATEST_NDK=$(ls -1 "$ANDROID_SDK_ROOT/ndk" | sort -V | tail -n 1)
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$LATEST_NDK" >> $GITHUB_ENV
            echo "Using NDK: $LATEST_NDK"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            LATEST_NDK=$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$LATEST_NDK" >> $GITHUB_ENV
            echo "Using NDK: $LATEST_NDK"
          else
            echo "NDK directory not found in SDK root, proceeding with host build."
          fi

      - name: Setup Native Libraries (TDLib & Go Core)
        run: |
          chmod +x scripts/setup_native_libs.sh
          ./scripts/setup_native_libs.sh

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: dart analyze --fatal-infos

      - name: Run Automated Test Suite
        run: flutter test --concurrency=1 --reporter expanded

      - name: Build Split APKs (arm64-v8a, x86_64)
        run: flutter build apk --split-per-abi --release

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Verify Generated APKs
        run: |
          echo "=== Built APK Binaries ==="
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudbeat-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
