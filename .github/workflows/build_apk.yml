name: Build and Release CloudBeat APKs

on:
  push:
    branches: [ "main", "feature/*" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Fetch and build native libraries
        run: |
          chmod +x scripts/setup_native_libs.sh
          ./scripts/setup_native_libs.sh

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: dart analyze

      - name: Run tests
        run: flutter test

      - name: Build APKs (Split per ABI)
        run: flutter build apk --split-per-abi --release

      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudbeat-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudbeat-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Upload armeabi-v7a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudbeat-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Generate Release Metadata
        id: meta
        run: |
          REF_NAME="${{ github.ref_name }}"
          SAFE_REF=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="$REF_NAME"
            TITLE="CloudBeat $REF_NAME"
            PRERELEASE="false"
          elif [[ "$REF_NAME" == "main" ]]; then
            TAG="nightly-main"
            TITLE="CloudBeat Nightly ($SHORT_SHA)"
            PRERELEASE="true"
          else
            TAG="preview-$SAFE_REF"
            TITLE="CloudBeat Preview [$REF_NAME] ($SHORT_SHA)"
            PRERELEASE="true"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.title }}
          body: |
            ### CloudBeat Build Information
            - **Branch**: `${{ github.ref_name }}`
            - **Commit**: [${{ steps.meta.outputs.short_sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **Triggered By**: @${{ github.actor }}
            - **Event**: `${{ github.event_name }}`
            
            ### Attached APKs
            - **`app-arm64-v8a-release.apk`**: Recommended for modern 64-bit Android smartphones & tablets.
            - **`app-armeabi-v7a-release.apk`**: For older 32-bit ARM Android devices.
            - **`app-x86_64-release.apk`**: For Android emulators and x86 devices.
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: build/app/outputs/flutter-apk/*.apk

