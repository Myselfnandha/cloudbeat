name: CloudBeat CI/CD - Ultra-Fast Matrix Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality Gate (Analysis & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: dart analyze --fatal-infos

      - name: Run Test Suite
        run: flutter test --concurrency=1 --reporter expanded

  build-apk:
    name: Build ARM64-v8a Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go_core/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Locate Android NDK
        id: setup-ndk
        run: |
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            LATEST_NDK=$(ls -1 "$ANDROID_SDK_ROOT/ndk" | sort -V | tail -n 1)
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$LATEST_NDK" >> $GITHUB_ENV
            echo "Using NDK: $LATEST_NDK"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            LATEST_NDK=$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$LATEST_NDK" >> $GITHUB_ENV
            echo "Using NDK: $LATEST_NDK"
          fi

      - name: Cache TDLib Native Binaries
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/jniLibs/arm64-v8a/libtdjson.so
            android/app/src/main/jniLibs/x86_64/libtdjson.so
          key: tdlib-binaries-v1.8.65

      - name: Setup Native Libraries (Parallel TDLib & Go Core)
        run: |
          chmod +x scripts/setup_native_libs.sh
          ./scripts/setup_native_libs.sh

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Install Dependencies
        run: flutter pub get

      - name: Build High-Performance ARM64 Release APK
        run: |
          flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Verify and Package APK
        run: |
          echo "=== Built APK Output ==="
          ls -lh build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/cloudbeat-arm64-v8a-release.apk

      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudbeat-arm64-v8a-apk
          path: build/app/outputs/flutter-apk/cloudbeat-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [quality-gate, build-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: cloudbeat-arm64-v8a-apk
          path: release-artifacts

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/cloudbeat-arm64-v8a-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
