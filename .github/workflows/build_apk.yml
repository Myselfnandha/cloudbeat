name: Build and Release CloudBeat APKs

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Fetch and build native libraries
        run: |
          chmod +x scripts/setup_native_libs.sh
          ./scripts/setup_native_libs.sh

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: dart analyze

      - name: Run tests
        run: flutter test

      - name: Build APKs (Split per ABI)
        run: flutter build apk --split-per-abi --release

      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudbeat-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudbeat-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
